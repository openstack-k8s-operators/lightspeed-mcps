---
# pre_kuttl hook for lightspeed-mcps-integration-tests-crc: deploy the
# OpenStack control plane on the CRC cluster the node already runs.
#
# run_hook executes this playbook with ci-framework's ansible.cfg and the
# zuul inventory, so the install_yamls_makes role generated during the
# bootstrap is available, and openshift_login has already run.
#
# The control plane is the minimal CR in minimal-control-plane.yml (keystone
# + cinder): the full install_yamls sample does not fit in the node's memory
# (the cell1 rabbitmq ends up Unschedulable and Ready is never reached).

- name: Deploy the OpenStack control plane on CRC
  hosts: localhost
  gather_facts: true
  vars:
    # Same environment as the kuttl tests: the install_yamls variables
    # (OUT, ...) plus oc in PATH. TIMEOUT is raised from the 500s default
    # because deploying the control plane on a 6 vCPU CRC takes much longer
    # than the defaults assume.
    make_env: >-
      {{ cifmw_install_yamls_environment
         | combine({'PATH': cifmw_path, 'TIMEOUT': '90m'}) }}
  tasks:
    - name: Initialize the local-storage PVs in the CRC VM
      ansible.builtin.include_role:
        name: install_yamls_makes
        tasks_from: make_crc_storage_with_retries
      vars:
        make_crc_storage_with_retries_env: "{{ make_env }}"

    - name: Install the openstack-operator from the OLM catalog
      ansible.builtin.include_role:
        name: install_yamls_makes
        tasks_from: make_openstack
      vars:
        make_openstack_env: "{{ make_env }}"

    - name: Create the openstack init resource (deploys the operators)
      ansible.builtin.include_role:
        name: install_yamls_makes
        tasks_from: make_openstack_init
      vars:
        make_openstack_init_env: "{{ make_env }}"

    - name: Create the control plane prerequisites (namespace, osp-secret)
      ansible.builtin.include_role:
        name: install_yamls_makes
        tasks_from: make_input
      vars:
        make_input_env: "{{ make_env }}"

    - name: Deploy the minimal control plane
      ansible.builtin.command:
        cmd: >-
          oc apply -n openstack -f {{ playbook_dir }}/minimal-control-plane.yml
      environment: "{{ make_env }}"
      changed_when: true

    - name: Wait for the control plane to be Ready
      ansible.builtin.command:
        cmd: >-
          oc wait openstackcontrolplane/openstack -n openstack
          --for condition=Ready --timeout=90m
      environment: "{{ make_env }}"
      changed_when: false
