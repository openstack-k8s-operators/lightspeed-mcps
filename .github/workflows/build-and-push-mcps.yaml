name: "Build and push S2I container image"

on:
  # This workflow can be invoked from another repository with:
  # jobs:
  #   image:
  #     uses: openstack-k8s-operators/lightspeed-mcps/.github/workflows/build-and-push-mcps.yaml@main
  #     secrets:
  #       QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
  #       QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
  workflow_call:
    inputs:
      image_name:
        description: Image name, without its registry and namespace. Defaults to the caller repository name.
        required: false
        type: string
        default: ""
      image_namespace:
        description: Namespace in quay.io to which the image is pushed.
        required: false
        type: string
        default: openstack-lightspeed
      build_context:
        description: Build context path.
        required: false
        type: string
        default: .
      containerfile:
        description: Containerfile path, relative to the caller repository.
        required: false
        type: string
        default: ./Containerfile
      build_args:
        description: Build arguments, one per line in KEY=VALUE format.
        required: false
        type: string
        default: ""
      prefetch_artifacts:
        description: Run artifacts_script before building.
        required: false
        type: boolean
        default: true
      artifacts_file:
        description: Artifact list to give to artifacts_script when prefetch_artifacts is true.
        required: false
        type: string
        default: ./.s2i/artifacts.txt
      artifacts_script:
        description: Script that fetches artifacts specified by artifacts_file.
        required: false
        type: string
        default: ./.s2i/get_artifacts.sh
      tags:
        description: Custom image tags. Defaults to '<sha> latest'.
        required: false
        type: string
        default: ""
      label_s2i_stream:
        description: |
          Value that should be used for the s2i.openstack.org/stream label. Passed
          to the Containerfile via the STREAM variable. Ensure you have s2i.openstack.org/stream=${STREAM}
          along with ARG STREAM in your Containerfile.
        required: false
        type: string
        default: main
      label_revision:
        description: |
          Value that should be used for the org.opencontainers.image.revision label.
          Passed to the Containerfile via the GIT_REVISION variable. Ensure you have
          ARG GIT_REVISION and LABEL org.opencontainers.image.revision=${GIT_REVISION}
          in your Containerfile.
        required: false
        type: string
      run_integration_tests:
        description: Run the integration test suite against the fake cluster after building the image.
        required: false
        type: boolean
        default: true
      integration_tests_blocking:
        description: Fail the workflow when the integration tests fail; set to false to report the failure but let the workflow (and the push) continue.
        required: false
        type: boolean
        default: true
    secrets:
      QUAY_USERNAME:
        description: Quay username used to publish the image.
        required: false
      QUAY_PASSWORD:
        description: Quay password or robot token used to publish the image.
        required: false

  workflow_dispatch: {}

  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

env:
  IMAGE_NAME: ${{ inputs.image_name || github.event.repository.name }}
  IMAGE_NAMESPACE: ${{ inputs.image_namespace || 'openstack-lightspeed' }}
  BUILD_CONTEXT: ${{ inputs.build_context || '.' }}
  CONTAINERFILE: ${{ inputs.containerfile || './Containerfile' }}
  ARTIFACTS_SCRIPT: ${{ inputs.artifacts_script || './.s2i/get_artifacts.sh' }}
  ARTIFACTS_FILE: ${{ inputs.artifacts_file || './.s2i/artifacts.txt' }}
  PUSH: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set TAGS
        run: |
          if [ -n "${{ inputs.tags }}" ]; then
            echo "TAGS=${{ inputs.tags }}" >> $GITHUB_ENV
          else
            echo "TAGS=${{ github.sha }} latest" >> $GITHUB_ENV
          fi

      - name: Prefetch build artifacts
        if: ${{ toJSON(inputs.prefetch_artifacts) != 'false' }}
        run: "${ARTIFACTS_SCRIPT} ${ARTIFACTS_FILE}"

      - name: Build image
        id: build_image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ env.TAGS }}
          oci: true
          context: ${{ env.BUILD_CONTEXT }}
          build-args: |
            STREAM=${{ inputs.label_s2i_stream || github.base_ref || github.ref_name }}
            GIT_REVISION=${{ inputs.label_revision || github.event.pull_request.head.sha || github.sha }}
            ${{ inputs.build_args }}
          containerfiles: |
            ${{ env.CONTAINERFILE }}

      - name: Set up uv
        if: ${{ toJSON(inputs.run_integration_tests) != 'false' }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Integration tests (fake cluster)
        if: ${{ toJSON(inputs.run_integration_tests) != 'false' }}
        continue-on-error: ${{ toJSON(inputs.integration_tests_blocking) == 'false' }}
        env:
          RHOS_MCPS_TEST_IMAGE: ${{ steps.build_image.outputs.image-with-tag }}
        run: ./scripts/run-integration-tests.sh

      - name: Log in to quay.io
        if: env.PUSH == 'true'
        uses: redhat-actions/podman-login@v2
        with:
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
          registry: quay.io

      - name: Push the image to quay.io
        if: env.PUSH == 'true'
        uses: redhat-actions/push-to-registry@v3
        id: push
        with:
          registry: quay.io/${{ env.IMAGE_NAMESPACE }}
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
